name: Sync lockfile

on:
  push:
    branches-ignore: [main]
    paths: [package.json]

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Regenerate bun.lock
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Regenerate lockfile
        run: bun install

      - name: Commit and push lockfile if it changed
        id: commit
        run: |
          if git diff --quiet -- bun.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name furqanagwan
          git config user.email furqanagwan@outlook.com
          git add bun.lock
          git commit -m "Sync bun.lock with package.json"
          git push origin "HEAD:${{ github.ref_name }}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Run CI on the synced commit
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "${{ github.ref_name }}"
