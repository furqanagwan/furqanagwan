name: Sync lockfile

on:
  push:
    branches-ignore: [main]
    paths: [package.json]

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Regenerate bun.lock
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Bun (oven-sh/setup-bun v2.2.0)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Regenerate lockfile
        run: bun install

      - name: Resolve dependencies requested at their latest version
        run: |
          names_requested_at_latest=$(bun -e '
            const manifest = await Bun.file("package.json").json();
            const declared = { ...manifest.dependencies, ...manifest.devDependencies };
            const names = Object.entries(declared).filter(([, spec]) => spec === "latest").map(([name]) => name);
            console.log(names.join(" "));
          ')
          if [ -n "$names_requested_at_latest" ]; then
            bun update --latest $names_requested_at_latest
          fi

      - name: Commit and push dependency files if they changed
        id: commit
        run: |
          if git diff --quiet -- bun.lock package.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name furqanagwan
          git config user.email furqanagwan@outlook.com
          git add bun.lock package.json
          git commit -m "Sync bun.lock with package.json"
          git push origin "HEAD:${{ github.ref_name }}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Run CI on the synced commit
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "${{ github.ref_name }}"
